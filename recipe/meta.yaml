{% set version = "1.23.0" %}

package:
  name: proprep
  version: {{ version }}

source:
  git_url: ..
  git_rev: HEAD

build:
  noarch: python
  number: 0
  # Mark this build as ours so it may check mjgplab/proprep for newer releases
  # (src/proprep/_distribution.py). The source tree, and so the AmberTools
  # build, keeps CHANNEL = None. The grep fails the build if the line moved.
  script:
    - sed -i.orig 's/^CHANNEL = None$/CHANNEL = "mjgplab"/' src/proprep/_distribution.py
    - rm -f src/proprep/_distribution.py.orig
    - grep -qx 'CHANNEL = "mjgplab"' src/proprep/_distribution.py
    - pip install . --no-deps --no-build-isolation
  entry_points:
    - proprep = proprep.main:main
    - mpsa = proprep.main:main
    - proprep-web = proprep.web.__main__:main

requirements:
  host:
    - python >=3.12,<3.14
    - pip
    - setuptools >=61.0
  run:
    - python >=3.12,<3.14
    - biopython >=1.83,<1.86
    - rich >=13.0
    - requests >=2.28
    - pyyaml >=6.0
    - numpy >=1.26,<2.0
    - networkx
    - scikit-learn >=1.3.0
    - sympy >=1.12
    - pydantic >=2.0,<3.0
    - psutil >=5.9.0
    - freesasa >=2.2
    - pdb2pqr >=3.5            # protein H-addition / pKa (conda-forge)
    - bioconda::reduce >=4     # ligand H-addition; AmberTools no longer bundles reduce
    - salilab::modeller
    - dacase::ambertools-dac =26
    # Molecular Docking (docking_prep): ligand and receptor preparation with
    # Meeko, docking with AutoDock Vina, AD4 maps with autogrid4. Versions are
    # the ones the docking validation ran on. Meeko is mjgplab's build without
    # prody, which conda-forge cannot install on osx-arm64 with Python >= 3.12
    # (packaging/meeko-noprody/README.md).
    - rdkit                    # also required by AmberTools 26
    - gemmi >=0.7
    - mjgplab::meeko 0.8.0 noprody*
    - vina 1.2.7
    - autogrid
    # Web shell (proprep-web) runtime dependencies
    - fastapi >=0.110
    - uvicorn >=0.27
    - httpx >=0.27

test:
  imports:
    - proprep
    - proprep.main
  commands:
    - proprep --help
    # every docking dependency is installed and found
    - python -c "from proprep.docking_prep.dependencies import check_dependencies, missing; gaps = missing(check_dependencies(), include_ad4=True); assert not gaps, [d.describe() for d in gaps]"

about:
  home: https://github.com/mjgplab/proprep
  license: MIT
  license_file: LICENSE
  summary: Protein Preparation Assistant - A modular workflow manager for processing PDB structures for MD simulations.
  description: |
    ProPrep (Protein Preparation Assistant) guides users through the complete
    workflow of preparing protein structures for molecular dynamics simulations
    with the Amber suite, from PDB retrieval through force field parameterization,
    tLEaP input generation, and MD input preparation.

extra:
  recipe-maintainers:
    - mjgplab
